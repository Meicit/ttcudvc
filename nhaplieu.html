<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập liệu - IOC Bình Hưng</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #003366; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #0984e3; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-submit:hover { background-color: #074b83; }
        .btn-back { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #666; }
        .btn-back:hover { color: #333; text-decoration: underline; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .coord-group { display: flex; gap: 15px; }
        .coord-group .form-group { flex: 1; }
        .help-text { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>NHẬP DỮ LIỆU ĐIỂM BẢN ĐỒ</h2>
        <form id="nhapLieuForm">
            <div class="form-group">
                <label for="loai_diem">Phân hệ (Loại điểm):</label>
                <select id="loai_diem" required>
                    <option value="" disabled selected>-- Chọn phân hệ --</option>
                    <option value="thu_gom_rac">♻️ Khu vực thu gom rác</option>
                    <option value="diem_den_rac">⚠️ Điểm đen rác</option>
                    <option value="tram_phat_thanh">📢 Trạm phát thanh</option>
                    <option value="pano">🖼️ Cụm pano tuyên truyền</option>
                    <option value="san_the_thao">⚽ Sân thể dục thể thao</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tieu_de">Tiêu đề / Tên điểm:</label>
                <input type="text" id="tieu_de" placeholder="VD: Trạm loa phát thanh Ấp 1" required>
            </div>

            <div class="form-group">
                <label for="dia_chi">Địa chỉ chi tiết:</label>
                <input type="text" id="dia_chi" placeholder="VD: Ngã ba đường A và đường B" required>
            </div>

            <div class="coord-group">
                <div class="form-group">
                    <label for="lat">Vĩ độ (Lat):</label>
                    <input type="number" id="lat" step="any" placeholder="VD: 10.7285123" required>
                </div>
                <div class="form-group">
                    <label for="lng">Kinh độ (Lng):</label>
                    <input type="number" id="lng" step="any" placeholder="VD: 106.6621456" required>
                </div>
            </div>
            <div class="help-text" style="margin-bottom: 15px; margin-top: -10px;">* Mẹo: Click chuột phải trên Google Maps để lấy cặp tọa độ này.</div>

            <div class="form-group">
                <label for="trang_thai">Trạng thái:</label>
                <select id="trang_thai" required>
                    <option value="Đang hoạt động">Đang hoạt động</option>
                    <option value="Chưa xử lý">Chưa xử lý</option>
                    <option value="Đang khắc phục">Đang khắc phục</option>
                    <option value="Tạm ngưng">Tạm ngưng</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hinh_anh">Đường dẫn hình ảnh (Không bắt buộc):</label>
                <input type="text" id="hinh_anh" placeholder="VD: https://link-anh-cua-ban.jpg">
            </div>

            <button type="submit" class="btn-submit">Thêm dữ liệu lên bản đồ</button>
            <div id="message"></div>
        </form>

        <a href="index.html" class="btn-back">⬅ Quay lại bản đồ tổng quan</a>
    </div>

    <script>
        document.getElementById('nhapLieuForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const msgBox = document.getElementById('message');
            msgBox.style.display = 'block';
            msgBox.className = '';
            msgBox.textContent = 'Đang gửi dữ liệu...';

            // Tạo đối tượng dữ liệu từ form
            const data = {
                loai_diem: document.getElementById('loai_diem').value,
                tieu_de: document.getElementById('tieu_de').value,
                dia_chi: document.getElementById('dia_chi').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                trang_thai: document.getElementById('trang_thai').value,
                hinh_anh: document.getElementById('hinh_anh').value
            };

            // ⚠️ QUAN TRỌNG: THAY ĐỔI ĐƯỜNG DẪN NÀY THÀNH LINK THỰC TẾ TRÊN HOSTING VIETTEL
            fetch('https://xabinhhung.gov.vn/api_insert_map_data.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if(result.success) {
                    msgBox.className = 'success';
                    msgBox.textContent = '✅ Thêm dữ liệu thành công!';
                    document.getElementById('nhapLieuForm').reset(); // Xóa trắng form
                } else {
                    msgBox.className = 'error';
                    msgBox.textContent = '❌ Lỗi: ' + result.error;
                }
            })
            .catch(error => {
                msgBox.className = 'error';
                msgBox.textContent = '❌ Lỗi kết nối tới máy chủ. Vui lòng kiểm tra lại đường dẫn API.';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
