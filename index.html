<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOC BINH HUNG</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- CSS tùy chỉnh của dự án -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Header quản lý chung -->
    <header class="ioc-header">
        <div class="title-group">
            <h1>CỔNG THÔNG TIN VÀ ĐIỀU HÀNH XÃ BÌNH HƯNG, THÀNH PHỐ HỒ CHÍ MINH</h1>
            <h2>IOC BÌNH HƯNG</h2>
        </div>
        <!-- Nút tải lại trang để lấy dữ liệu mới từ Database -->
        <button class="btn-refresh" onclick="location.reload()">Tải lại dữ liệu</button>
    </header>

    <!-- Khung chứa các module -->
    <main id="main-dashboard">
        <!-- Module Bản đồ -->
        <div id="map-module"></div>
    </main>

    <!-- Thư viện JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Turf.js: Thư viện xử lý không gian (tạo mặt nạ che khu vực bên ngoài) -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    
    <!-- Gọi module xử lý bản đồ -->
    <script src="js/map_module.js"></script>
</body>
</html>
