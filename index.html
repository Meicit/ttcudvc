<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ IOC - Bình Hưng</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100vh; background-color: #f5f5f5; }

        /* CSS cho Marker phát sáng (Neon Glow) giống trong ảnh */
        .glow-marker {
            background-color: white;
            border-radius: 50%; /* Bo tròn 100% */
            border: 3px solid #00e5ff; /* Viền màu xanh cyan */
            box-shadow: 0 0 15px #00e5ff, inset 0 0 8px #00e5ff; /* Hiệu ứng phát sáng */
            overflow: hidden; /* Cắt phần ảnh thừa ra ngoài viền tròn */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }
        
        .glow-marker:hover {
            transform: scale(1.1); /* Phóng to nhẹ khi di chuột vào */
            box-shadow: 0 0 25px #00e5ff, inset 0 0 10px #00e5ff;
            cursor: pointer;
        }

        .glow-marker img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Đảm bảo ảnh lấp đầy khung tròn không bị méo */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Turf.js (Thư viện xử lý không gian, dùng để làm mặt nạ) -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <script>
        // 1. Khởi tạo bản đồ
        const map = L.map('map', {
            zoomControl: false // Tắt nút zoom mặc định (nếu muốn bản đồ sạch)
        }).setView([10.7250, 106.6700], 14);

        // 2. Thêm lớp bản đồ nền CartoCDN Positron (Nền sáng giống trong ảnh)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // 3. Tải GeoJSON và tạo hiệu ứng đồ họa
        fetch('binh_hung.geojson') // Đường dẫn tới file ranh giới của bạn
            .then(res => res.json())
            .then(data => {
                
                // --- BƯỚC 3.1: LÀM MỜ BÊN NGOÀI (MASKING) ---
                // Tạo một hình chữ nhật khổng lồ bao phủ toàn thế giới
                const world = turf.bboxPolygon([-180, -90, 180, 90]);
                // Lấy hình thế giới "trừ đi" ranh giới xã Bình Hưng (tạo ra một lỗ hổng ở giữa)
                const binhHungPolygon = data.features[0]; 
                const mask = turf.difference(world, binhHungPolygon);

                // Vẽ lớp mặt nạ màu xám đen phủ lên bản đồ
                L.geoJSON(mask, {
                    style: {
                        fillColor: '#333333', // Màu tối
                        fillOpacity: 0.15,    // Độ mờ (Chỉnh từ 0.1 đến 0.5 tùy ý)
                        color: 'none',        // Không có viền cho lớp mặt nạ
                        interactive: false    // Xuyên click để tương tác được với bản đồ bên dưới
                    }
                }).addTo(map);


                // --- BƯỚC 3.2: VẼ ĐƯỜNG VIỀN NÉT ĐỨT MÀU ĐỎ/HỒNG ---
                L.geoJSON(data, {
                    style: {
                        color: '#d63031',     // Màu đỏ/hồng giống ảnh
                        weight: 3,            // Độ dày
                        dashArray: '8, 8',    // Hiệu ứng nét đứt
                        fillOpacity: 0,       // Ở trong suốt hoàn toàn để thấy rõ nền Carto
                        interactive: false
                    }
                }).addTo(map);

                // Tự động zoom bản đồ vừa vặn với ranh giới
                const bounds = L.geoJSON(data).getBounds();
                map.fitBounds(bounds, { padding: [20, 20] });
            })
            .catch(err => console.log("Chưa có file GeoJSON hoặc đường dẫn sai", err));


        // --- BƯỚC 4: THÊM CÁC ĐIỂM MARKER PHÁT SÁNG ---
        // Hàm hỗ trợ tạo Marker tùy chỉnh
        function createGlowMarker(lat, lng, imageUrl) {
            const customIcon = L.divIcon({
                className: 'custom-div-icon', // Lớp cha
                // Mã HTML bên trong chứa cấu trúc tròn và ảnh
                html: `<div class="glow-marker" style="width: 60px; height: 60px;">
                           <img src="${imageUrl}" alt="Địa điểm">
                       </div>`,
                iconSize: [60, 60], // Kích thước icon
                iconAnchor: [30, 30] // Điểm neo (tâm của hình tròn)
            });

            L.marker([lat, lng], { icon: customIcon }).addTo(map);
        }

        // Thêm 3 điểm mẫu dọc theo đường Nguyễn Văn Linh (Tọa độ minh họa)
        // Lưu ý: Đổi URL ảnh thành ảnh thực tế của bạn
        createGlowMarker(10.7300, 106.6500, 'https://picsum.photos/100/100?random=1');
        createGlowMarker(10.7250, 106.6650, 'https://picsum.photos/100/100?random=2');
        createGlowMarker(10.7350, 106.6800, 'https://picsum.photos/100/100?random=3');

    </script>
</body>
</html>
